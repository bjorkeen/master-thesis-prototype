# cost_model.yaml
# ================
# Operational cost values for evaluating decision quality in the HITL-CDT system.
#
# Each (final_action, ground_truth) pair maps to a cost via _compute_cost in the
# Decision Service. Used for per-decision logging and experiment aggregation.
#
# All values are in arbitrary units (euros in the thesis). Relative magnitudes matter.

# ---- Correct decisions (ground truth = prediction) ----

correct_auto_resolve: 0
correct_escalation: 10
correct_critical: 15

# ---- Incorrect decisions (ground truth ≠ prediction) ----

false_escalation: 10
missed_escalation: 50
missed_critical: 100

# ---- Human override costs ----

# RESERVED / NOT APPLIED: _compute_cost does not reference this key. Overrides are
# scored by (final_action, ground_truth) like any other decision outcome.
human_misclassification: 30

# ---- Experiment evaluation aggregation ----

# NOT IMPLEMENTED: Decision Service always sums per-decision costs (total_cost).
summary_metric: "total_cost"

# ---- Thresholds for alerts ----

# NOT IMPLEMENTED: no runtime alerting reads these keys.
alert_threshold_cost_per_incident: 20
alert_threshold_missed_critical_pct: 5
