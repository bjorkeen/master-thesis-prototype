# routing_config.yaml
# =====================
# Decision routing thresholds and experiment protocol for the HITL-CDT prototype.
#
# The Decision Service (services/decision-service/main.py) reads this file at startup.
# Routing is CLASS-AWARE in HITL mode (_apply_routing_logic), not a flat 3-way
# confidence cut. Pseudocode for HITL:
#   1. ML service predicts a class + confidence
#   2. predicted critical  → always route='critical' (safety-first; never auto-resolved)
#   3. predicted auto_resolve → route='auto_resolve' if confidence >= T_auto, else 'escalate'
#   4. predicted escalate  → route='critical' if confidence < T_crit, else 'escalate'
#
# ai_only uses the predicted class directly; human_only always routes to escalate.

# ---- Confidence-based thresholds (HITL gates) ----

# auto_resolve_threshold: minimum confidence to auto-resolve when the model predicts
# auto_resolve. Rationale: false auto-resolve on a critical incident is costly (€100).
auto_resolve_threshold: 0.85

# critical_threshold: when the model predicts escalate, confidence BELOW this routes
# to critical (high uncertainty). Rationale: <50% confidence ≈ near-random on that class.
critical_threshold: 0.50

# ---- SLA and time-pressure behavior ----

# sla_escalation_boost: if true, tighten decision gates as SLA pressure rises.
sla_escalation_boost: true

# sla_boost_schedule: threshold adjustments when SLA remaining drops below each tier.
# NOTE: auto_resolve_threshold_reduction RAISES the auto_resolve threshold (harder to
# auto-close), despite the key name — it is added to the base threshold in code.
sla_boost_schedule:
  # Once SLA remaining < 600 s (10 min), tighten auto_resolve by +10% and critical by +5%.
  minutes_remaining_10:
    auto_resolve_threshold_reduction: 0.10
    critical_threshold_increase: 0.05

  # Once SLA remaining < 300 s (5 min), tighten auto_resolve by +20% and critical by +10%.
  minutes_remaining_5:
    auto_resolve_threshold_reduction: 0.20
    critical_threshold_increase: 0.10

# ---- Experiment control ----

default_experiment_mode: "hitl"
max_incidents_per_experiment: 100
experiment_seed: 42

# ---- Twin / ML service URLs (used by Decision Service) ----

# NOT IMPLEMENTED: periodic background sync — Decision Service polls Twin on each /route instead.
enable_twin_state_sync: true

twin_service_url: "http://localhost:8002"
ml_service_url: "http://localhost:8001"

# NOT IMPLEMENTED: services use in-memory storage; db.py schema exists for production.
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "hitl_cdt"

# ---- Analyst workload limits ----

# NOT IMPLEMENTED: queue-depth / workload thresholds are not read by Decision Service.
max_escalated_queue_depth: 20
analyst_workload_high_threshold_pct: 75
